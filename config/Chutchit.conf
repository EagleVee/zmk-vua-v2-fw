#Enables the sleep management features
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=600000
# Report battery every 60 s so dongle display updates ~once per minute
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# Fetch peripheral (right/num) battery levels over BLE when in BLE mode
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# Right/Num proxy their battery to the left central via BLE GATT
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y


CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

#EXT POWER
CONFIG_ZMK_EXT_POWER=y


# Mouse support
CONFIG_ZMK_POINTING=y


# Prevent ZMK Studio from modifying keymap (set to 'y' to lock keymap updates)
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_KEYBOARD_NAME="VU.A 2.0"

# Bluetooth setup
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# 2.4G Wireless (dongle support)
CONFIG_ZMK_2G4=y
CONFIG_ZMK_ESB=y
CONFIG_ZMK_ESB_PIPE_COUNT=8
CONFIG_ZMK_ESB_MAX_PAYLOAD_LENGTH=32
CONFIG_ZMK_2G4_RF_CHANNEL=2
CONFIG_ZMK_2G4_TX_POWER=8
CONFIG_ZMK_2G4_ADDR_BASE_0=0xE7
CONFIG_ZMK_2G4_ADDR_BASE_1=0xE7
CONFIG_ZMK_2G4_ADDR_BASE_2=0xE7
CONFIG_ZMK_2G4_ADDR_BASE_3=0xE7
CONFIG_ZMK_2G4_ADDR_PREFIX=0xE7
CONFIG_ZMK_2G4_AES_KEY=""

# ESB Split: right and num connect to central via ESB when in dongle mode.
# Peripheral indices are set per-half in Kconfig.defconfig (right=0, num=1).
# Split base address (must differ from dongle base to avoid address collision).
CONFIG_ZMK_SPLIT_ESB=y
CONFIG_ZMK_SPLIT_ESB_RF_CHANNEL=2
CONFIG_ZMK_SPLIT_ESB_TX_POWER=8
CONFIG_ZMK_SPLIT_ESB_ADDR_BASE_0=0xD7
CONFIG_ZMK_SPLIT_ESB_ADDR_BASE_1=0xD7
CONFIG_ZMK_SPLIT_ESB_ADDR_BASE_2=0xD7
CONFIG_ZMK_SPLIT_ESB_ADDR_BASE_3=0xD7
CONFIG_ZMK_SPLIT_ESB_PIPE_PREFIX_0=0xC2
CONFIG_ZMK_SPLIT_ESB_PIPE_PREFIX_1=0xC3

# Uncomment these lines to add support for encoders
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
CONFIG_SENSOR_LOG_LEVEL_DBG=y

# enforce windows to show keyboard battery
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=y

# Turn on logging, and set ZMK logging to debug output
# WARNING: BATTERY INTENSIVE, TURN OFF WHEN NOT DEBUGGING
#CONFIG_ZMK_USB_LOGGING=y





