# VU.A 2.0 Dongle Configuration
# Custom nRF52840 PCB (eyeslash-corne-dongle based) — 2.4G PRX + USB HID + display

# ── Radio & Transport ────────────────────────────────────────────────────────
# Disable Bluetooth (USB-only dongle, BLE split runs on left half)
CONFIG_BT=n

# USB output (required by ZMK_2G4_DONGLE dependency)
CONFIG_ZMK_USB=y

# Enable 2.4G dongle (PRX) role
CONFIG_ZMK_2G4_DONGLE=y

# ESB radio
CONFIG_ZMK_ESB=y
CONFIG_ZMK_ESB_PIPE_COUNT=8
CONFIG_ZMK_ESB_TX_FIFO_SIZE=16
CONFIG_ZMK_ESB_RX_FIFO_SIZE=16
CONFIG_ZMK_ESB_MAX_PAYLOAD_LENGTH=32
CONFIG_ZMK_ESB_DEFAULT_RF_CHANNEL=2

# 2.4G settings (must match left half Chutchit.conf)
CONFIG_ZMK_2G4_RF_CHANNEL=2
CONFIG_ZMK_2G4_TX_POWER=8
CONFIG_ZMK_2G4_ADDR_BASE_0=0xE7
CONFIG_ZMK_2G4_ADDR_BASE_1=0xE7
CONFIG_ZMK_2G4_ADDR_BASE_2=0xE7
CONFIG_ZMK_2G4_ADDR_BASE_3=0xE7
CONFIG_ZMK_2G4_ADDR_PREFIX=0xE7
CONFIG_ZMK_2G4_AES_KEY=""

# ── Display (SH1106 OLED via I2C) ────────────────────────────────────────────
CONFIG_ZMK_DISPLAY=y
CONFIG_PINCTRL=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_INPUT=y
CONFIG_ZMK_WPM=y
CONFIG_ZMK_WIDGET_WPM_STATUS=y
# Temporary: enable USB serial logging to debug 2.4G ESB startup
CONFIG_ZMK_USB_LOGGING=y
# ── RGB Underglow (WS2812 via SPI3) ──────────────────────────────────────────
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=y
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=90
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=160
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3

# ── Backlight (PWM) ──────────────────────────────────────────────────────────
CONFIG_ZMK_BACKLIGHT=y
CONFIG_ZMK_BACKLIGHT_BRT_START=100
CONFIG_ZMK_BACKLIGHT_ON_START=y
CONFIG_ZMK_BACKLIGHT_AUTO_OFF_IDLE=n
CONFIG_PWM=y
CONFIG_LED_PWM=y

# ── EXT_POWER ────────────────────────────────────────────────────────────────
CONFIG_ZMK_EXT_POWER=y

# ── Sleep ────────────────────────────────────────────────────────────────────
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=3600000
