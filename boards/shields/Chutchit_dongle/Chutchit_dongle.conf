# Chutchit Dongle Configuration
# 2.4G receiver for wireless keyboard

# Enable 2.4G dongle mode
CONFIG_ZMK_2G4_DONGLE=y
CONFIG_ZMK_2G4=y

# USB HID
CONFIG_ZMK_USB_HID=y
CONFIG_ZMK_HID_REPORT_KEYBOARD=y
CONFIG_ZMK_HID_BOOT_PROTOCOL=y
CONFIG_ZMK_HID_REPORT_MOUSE=y
CONFIG_ZMK_POINTING=y

# Disable Bluetooth on dongle (USB-only)
CONFIG_BT=n

# ESB radio configuration  
CONFIG_ZMK_ESB=y
CONFIG_ZMK_ESB_PIPE_COUNT=8
CONFIG_ZMK_ESB_TX_FIFO_SIZE=16
CONFIG_ZMK_ESB_RX_FIFO_SIZE=16
CONFIG_ZMK_ESB_MAX_PAYLOAD_LENGTH=32
CONFIG_ZMK_ESB_DEFAULT_RF_CHANNEL=2

# 2.4G wireless settings (match left half)
CONFIG_ZMK_2G4_RF_CHANNEL=2
CONFIG_ZMK_2G4_TX_POWER=8
CONFIG_ZMK_2G4_ADDR_BASE_0=0xE7
CONFIG_ZMK_2G4_ADDR_BASE_1=0xE7
CONFIG_ZMK_2G4_ADDR_BASE_2=0xE7
CONFIG_ZMK_2G4_ADDR_BASE_3=0xE7
CONFIG_ZMK_2G4_ADDR_PREFIX=0xE7

# AES encryption (leave empty to disable encryption for dev)
CONFIG_ZMK_2G4_AES_KEY=""

# Dongle receive timeout
CONFIG_ZMK_2G4_DONGLE_INIT_PRIORITY=95
