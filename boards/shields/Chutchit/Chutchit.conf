# Enable soft off functionality
CONFIG_ZMK_POWER=y
CONFIG_ZMK_POWER_SOFT_OFF=y

# Disable built-in BLE advertising LED — we use ZMK_STATUS_LED instead
CONFIG_ZMK_BLE_ADV_LED=n

# Onboard Nice Nano blue LED as status indicator:
#   Left  : solid = USB, fast-blink = BLE searching, 1/2-blink = mode
#   Right/Num: fast-blink for 30 s on boot to show pairing window
CONFIG_ZMK_STATUS_LED=y

# Set a power idle timeout in milliseconds (optional, adjust as needed)
# 10 minutes idle before power soft-off
CONFIG_ZMK_POWER_IDLE_TIMEOUT=600000
