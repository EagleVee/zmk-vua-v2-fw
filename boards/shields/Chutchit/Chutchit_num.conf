# The num cluster is the second ESB split peripheral (right = index 0).
# Pin it here in a .conf fragment rather than Kconfig.defconfig: a numeric
# `default` in Kconfig.defconfig does not reliably win over the module's
# `default 0`, which left the num building as index 0 and colliding with the
# right half on the same ESB pipe/prefix in dongle mode.
CONFIG_ZMK_SPLIT_ESB_PERIPHERAL_INDEX=1
