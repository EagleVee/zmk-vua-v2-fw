# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command and `artifact-name` to assign a name to
# distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     cmake-args: -DCONFIG_ZMK_USB_LOGGING=y
#     artifact-name: corne_left_with_logging
#
---
include:
  - board: nice_nano
    shield: Chutchit_left
    snippet: studio-rpc-usb-uart
    cmake-args: -DCONFIG_ZMK_STUDIO=y -DCONFIG_ZMK_STUDIO_LOCKING=n -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y

  - board: nice_nano
    shield: Chutchit_right
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

  - board: nice_nano
    shield: Chutchit_num
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=n
  
  - board: nice_nano
    shield: Chutchit_dongle

  - board: nice_nano
    shield: Chutchit_dongle
    snippet: zmk-usb-logging
    artifact-name: Chutchit_dongle_logging

  - board: nice_nano
    shield: Chutchit_left
    snippet: zmk-usb-logging
    cmake-args: -DCONFIG_ZMK_SPLIT_ROLE_CENTRAL=y
    artifact-name: Chutchit_left_logging

  - board: nice_nano
    shield: settings_reset
